name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: config.settings.test
  POSTGRES_DB: ipscout
  POSTGRES_USER: ipscout
  POSTGRES_PASSWORD: ipscout
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  REDIS_URL: redis://localhost:6379/0
  DJANGO_SECRET_KEY: ci-test-key-not-for-production
  SSH_CREDENTIAL_ENCRYPTION_KEY: NnoRYXW2HCoNNQfvq6cLLoAz4OH__-_DyNQPpBD0MZA=

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipscout
          POSTGRES_USER: ipscout
          POSTGRES_PASSWORD: ipscout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipscout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite with coverage
        run: |
          coverage run --source=apps,config manage.py test
          coverage report --skip-covered -m

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: ruff
        run: ruff check .

      - name: mypy
        # Informational only: pre-existing type debt (untyped third-party
        # stubs, a couple of real narrowing gaps) isn't cleaned up yet, and
        # mypy 1.10 crashes internally on one file under django-stubs 6.x.
        # Surface it without blocking merges until that's sorted out.
        run: mypy . || true
