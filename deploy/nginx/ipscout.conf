# Traditional (non-Docker) deployment reverse proxy. For the Docker
# Compose path see docker/nginx/nginx.conf instead - the only difference
# is the upstream (a container hostname there, 127.0.0.1 here where
# gunicorn is a systemd service on the same host).
#
# Install: sudo cp deploy/nginx/ipscout.conf /etc/nginx/sites-available/ipscout
#          sudo ln -s /etc/nginx/sites-available/ipscout /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream ipscout_web {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name ipscout.example.com;  # replace with your real hostname

    client_max_body_size 10m;

    location /static/ {
        alias /opt/ipscout/staticfiles/;
    }

    location /media/ {
        alias /opt/ipscout/media/;
    }

    location / {
        proxy_pass http://ipscout_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Once you have a certificate (e.g. via certbot), add a second server
# block on 443 with ssl_certificate/ssl_certificate_key and redirect this
# one to it - config.settings.production already sets SECURE_SSL_REDIRECT
# and expects to sit behind exactly this kind of TLS-terminating proxy
# (SECURE_PROXY_SSL_HEADER is set for X-Forwarded-Proto above).
