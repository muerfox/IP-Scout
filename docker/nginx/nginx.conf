# Reverse proxy in front of the Django/Gunicorn `web` service.
# This is IP Scout's own front door - unrelated to the monitored Nginx
# servers the application ingests 503 logs from.

upstream ipscout_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://ipscout_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
