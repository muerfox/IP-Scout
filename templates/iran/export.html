{% extends "base.html" %}

{% block title %}Iran Exports — IP Scout{% endblock %}
{% block topbar_title %}Iran IP Export{% endblock %}

{% block content %}
  <h1>Iran IP Export <span class="subtitle">{{ count }} IP{{ count|pluralize }} matched</span></h1>

  <form method="get" class="form-card" style="max-width:640px;">
    <div class="form-row">
      <label for="id_period">Period</label>
      <select name="period" id="id_period">
        <option value="all" {% if filters.period == "all" %}selected{% endif %}>All time</option>
        <option value="24h" {% if filters.period == "24h" %}selected{% endif %}>Last 24 hours</option>
        <option value="7d" {% if filters.period == "7d" %}selected{% endif %}>Last 7 days</option>
        <option value="30d" {% if filters.period == "30d" %}selected{% endif %}>Last 30 days</option>
      </select>
    </div>
    <div class="form-row">
      <label for="id_server">Server</label>
      <select name="server" id="id_server">
        <option value="">All servers</option>
        {% for server in servers %}
          <option value="{{ server.pk }}" {% if filters.server_id == server.pk %}selected{% endif %}>{{ server.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label for="id_cidr">CIDR</label>
      <input type="text" name="cidr" id="id_cidr" value="{{ filters.cidr }}" placeholder="5.1.0.0/22 (optional)">
    </div>
    <div class="form-row">
      <label for="id_iran_status">Iran status</label>
      <select name="iran_status" id="id_iran_status">
        <option value="current" {% if filters.iran_status == "current" %}selected{% endif %}>Currently Iranian</option>
        <option value="previous" {% if filters.iran_status == "previous" %}selected{% endif %}>Previously Iranian</option>
        <option value="any" {% if filters.iran_status == "any" %}selected{% endif %}>Any</option>
      </select>
    </div>
    <div class="form-row form-check">
      <input type="hidden" name="status_503_only" value="false">
      <input type="checkbox" name="status_503_only" id="id_503_only" value="true" {% if filters.status_503_only %}checked{% endif %}>
      <label for="id_503_only">503 only (IPs with 503 activity)</label>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Apply Filters</button>
    </div>
  </form>

  <div class="section-title">Result</div>
  <textarea id="export-preview" readonly rows="14" style="width:100%; max-width:640px; background:#0e0e0e; border:1px solid var(--border); color:var(--text); font-family:var(--mono); font-size:13px; padding:10px; border-radius:3px;">{% for address in addresses %}{{ address }}
{% endfor %}</textarea>

  <div class="form-actions">
    <button type="button" class="btn" onclick="navigator.clipboard.writeText(document.getElementById('export-preview').value)">Copy</button>
    <a class="btn" href="{% url 'iran:export-download' %}?{{ querystring }}&format=txt">Download TXT</a>
    <a class="btn" href="{% url 'iran:export-download' %}?{{ querystring }}&format=csv">Download CSV</a>
    <a class="btn" href="{% url 'iran:export-download' %}?{{ querystring }}&format=json">Download JSON</a>
  </div>
{% endblock %}
