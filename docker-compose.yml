x-django-image: &django-image
  build:
    context: .
    args:
      REQUIREMENTS_FILE: requirements/development.txt
  env_file: .env
  volumes:
    - .:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ipscout}
      POSTGRES_USER: ${POSTGRES_USER:-ipscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipscout}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipscout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    <<: *django-image
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

  worker:
    <<: *django-image
    command: celery -A config worker -Q logs,ips,whois,iran,maintenance -l info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

  beat:
    <<: *django-image
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    ports:
      - "8080:80"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
